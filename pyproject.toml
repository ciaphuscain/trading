[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-quant"
version = "0.1.0"
description = "OMEGA QUANT: evidence-first quantitative research and paper-trading platform for small NSE cash-equity accounts"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "scipy>=1.11,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pytest>=8", "hypothesis>=6.100", "pyarrow>=14"]

[project.scripts]
omega = "omega.cli:main"

[tool.setuptools.packages.find]
include = ["omega*"]

[tool.setuptools.package-data]
omega = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
